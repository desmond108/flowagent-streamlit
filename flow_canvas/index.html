<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0A1628; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #wrap { overflow:auto; }
  #root { position:relative; transform-origin: top left; }
  .fa-handle {
    position:absolute; z-index:60; cursor:grab; border-radius:8px;
    border:2px solid transparent; box-sizing:border-box;
  }
  .fa-handle:hover { border-color:#60A5FA; background:rgba(96,165,250,.10); }
  .fa-handle.sel   { border-color:#60A5FA; background:rgba(96,165,250,.16); }
  .fa-handle.drag  { cursor:grabbing; border-color:#93C5FD; background:rgba(147,197,253,.22); }
  #hint {
    position:sticky; left:0; top:0; z-index:80; padding:5px 10px;
    font-size:11px; color:#7C8DB5; background:#0A1628; border-bottom:1px solid #16284A;
  }
</style>
</head>
<body>
<div id="hint">Drag a box to reposition it · click to select</div>
<div id="wrap"><div id="root"></div></div>

<script>
// --- Streamlit component protocol (raw postMessage; no build step needed) ---
function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function setValue(value) { post("streamlit:setComponentValue", { value: value, dataType: "json" }); }
function setHeight(h)    { post("streamlit:setFrameHeight", { height: h }); }

const root = document.getElementById("root");
const wrap = document.getElementById("wrap");
let state = { rects: {}, snap: 0, selected: null, scale: 1 };

window.addEventListener("message", function (e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  render(e.data.args || {});
});

function render(args) {
  const stamp = args.stamp || "";
  state.rects = args.rects || {};
  state.snap = args.snap || 0;
  state.selected = args.selected || null;

  // Re-inject only when Python has produced new markup. Python is authoritative:
  // we move a box locally for feedback, then Python re-renders (re-routing the
  // arrows) and that render replaces ours.
  if (root.dataset.stamp !== stamp) {
    root.innerHTML = args.html || "";
    root.dataset.stamp = stamp;
    buildHandles();
  } else {
    // same markup, selection may have changed
    document.querySelectorAll(".fa-handle").forEach(function (h) {
      h.classList.toggle("sel", h.dataset.nid === state.selected);
    });
  }

  // Fit the 1280px-wide diagram into whatever width Streamlit gives us.
  const avail = wrap.clientWidth || (args.width || 1280);
  state.scale = Math.min(1, avail / (args.width || 1280));
  root.style.transform = "scale(" + state.scale + ")";
  root.style.width  = (args.width  || 1280) + "px";
  root.style.height = (args.height || 720) + "px";
  setHeight(Math.ceil((args.height || 720) * state.scale) + 34);
}

function snap(v) { return state.snap > 0 ? Math.round(v / state.snap) * state.snap : v; }

function buildHandles() {
  Object.keys(state.rects).forEach(function (nid) {
    const r = state.rects[nid];
    const box = root.querySelector('[data-nid="' + (window.CSS && CSS.escape ? CSS.escape(nid) : nid) + '"]');
    const h = document.createElement("div");
    h.className = "fa-handle" + (nid === state.selected ? " sel" : "");
    h.dataset.nid = nid;
    h.style.left = r.x + "px";
    h.style.top = r.y + "px";
    h.style.width = r.w + "px";
    h.style.height = r.h + "px";
    h.title = nid;
    root.appendChild(h);

    let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

    h.addEventListener("mousedown", function (ev) {
      dragging = true; moved = false;
      sx = ev.clientX; sy = ev.clientY;
      ox = parseFloat(h.style.left); oy = parseFloat(h.style.top);
      h.classList.add("drag");
      ev.preventDefault(); ev.stopPropagation();
    });

    window.addEventListener("mousemove", function (ev) {
      if (!dragging) return;
      // Divide by scale so the box tracks the cursor when the view is zoomed out.
      const nx = snap(ox + (ev.clientX - sx) / state.scale);
      const ny = snap(oy + (ev.clientY - sy) / state.scale);
      if (Math.abs(nx - ox) > 1 || Math.abs(ny - oy) > 1) moved = true;
      h.style.left = nx + "px"; h.style.top = ny + "px";
      if (box) { box.style.left = nx + "px"; box.style.top = ny + "px"; }
    });

    window.addEventListener("mouseup", function () {
      if (!dragging) return;
      dragging = false;
      h.classList.remove("drag");
      const nx = parseFloat(h.style.left), ny = parseFloat(h.style.top);
      // A click (no movement) selects; a drag commits a new position.
      setValue(moved
        ? { action: "move", nid: nid, x: nx, y: ny, t: Date.now() }
        : { action: "select", nid: nid, t: Date.now() });
    });
  });
}

post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
